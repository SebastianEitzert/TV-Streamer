      <stop offset="0" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- TV body -->
  <rect x="16" y="36" width="224" height="152" rx="22" fill="#263238"/>
  <rect x="28" y="48" width="200" height="128" rx="12" fill="url(#screen)"/>
  <!-- stand -->
  <path d="M104 188 h48 l10 26 h-68 z" fill="#263238"/>
  <rect x="80" y="210" width="96" height="12" rx="6" fill="#263238"/>
