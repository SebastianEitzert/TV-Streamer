<title>TV Streamer</title>
<!-- KI generiert (Claude, 21.10.2026): Empfangsseite des TV-Streamers. Spielt das Bild des Browsers auf der VM
     als Video ab (MSE, normaler Videoweg des Fernsehers) und schickt Zeiger, Klicks, Mausrad und Tasten zurück.
     Bewusst ES5 – läuft auch in alten Fernseher-Browsern. Parameter: ?debug=1 (Messwerte), ?uhr=1 (Uhr für
     Verzögerungs-Foto), ?lag=0.12 (Abstand zum neuesten Bild in s).
     23.10.: Leiste und Hinweise wachsen mit der Fensterbreite (Schlafzimmer 960 Punkte → halb so groß wie am PC);
     Farbtasten wie die Systeme: blau Home Assistant, grün Loxone, gelb neu laden, rot zurück.
     23.10. (.12): Bildweg WebRTC (?video=webrtc) – Bild über go2rtc, kaum Puffer. ?video=mse erzwingt den Videostrom
     über WebSocket. Ohne Angabe gilt die Voreinstellung des Streamers (Fernseher: VIDEO_TV, sonst VIDEO_PC). Scheitert
     WebRTC (keine Verbindung, nach 12 s kein Bild), geht es von selbst mit MSE weiter. ?webrtc=fhd|hd: Bild 1920|1280 breit.
     ?fps=60: Bildrate des MSE-Kodierers (zum Ausprobieren, ob der Fernseher dann weniger puffert).
     ?nachlauf=1.0: so weit darf der MSE-Puffer über das Ziel wachsen, bevor gesprungen wird (Fernseher 1,0 s, PC 0,3 s).
     ?rtc=tcp|udp|auto: Transportweg für WebRTC (Standard auto). Per UDP verlor das Wohnzimmer am 23.10. Tausende Pakete
     (große Schlüsselbilder als Schwall) → seit .14 kodiert der Streamer ohne große Schlüsselbilder.
     23.10. (.15): Schlüsselbild auf Abruf – die Seite fordert eines an, wenn der Dekoder nach Paketverlust nicht weiter
     kann (PLI) oder das Bild 1,2 s steht.
     23.10. (.17): Nach einem Rückfall auf MSE versucht die Seite WebRTC von selbst wieder (nach 1, 2, 4 … 16 min).
     Verlauf der letzten Ereignisse (verlauf) und Verbindungszustände in den Messwerten – für die Fehlersuche ohne
     Blick auf den Fernseher. MSE-Nachlauf am Fernseher wieder 1,0 s (0,4 s ließ das Schlafzimmer alle 8 s springen).
     23.10. (.18): Vor einem Rückfall gehen die letzten WebRTC-Messwerte an die VM; dazu, wie viel überhaupt ankommt
     (paar_kb, transport_kb – auch das, was der Fernseher danach verwirft).
     23.10. (.19): Kommen Daten an, zählt der Fernseher aber nach 3 s noch kein einziges Paket (Schlafzimmer nach einem
     Abbruch – hilft nur Aus/An), geht es sofort mit MSE weiter und WebRTC erst nach 60 min wieder. Mehr Fehlersuche
     (empfang, chiffre, spur). Nach einem Update des Streamers lädt sich die Seite selbst neu (?neu=<Fassung>).
     23.10. (.20): Steht das Bild 6 s (z. B. Streamer startet neu), verbindet die Seite per WebRTC neu – vorher fiel sie
     dabei für 1 min auf MSE zurück.
     23.10. (.21): Dekodiert der Fernseher WebRTC 20 s lang mit weniger als 20 Bildern/s (Wohnzimmer nach mehrfachem
     Neuladen: 7 Bilder/s, auch nach Aus/An), geht es mit MSE weiter (Hardware-Decoder, flüssig) und WebRTC erst nach 60 min
     wieder. Beim Verlassen/Neuladen der Seite wird die WebRTC-Verbindung ausdrücklich geschlossen.
     23.10. (.22): Nach einem Bildstillstand (Streamer startet neu, Netz weg) erst 1 min MSE, dann WebRTC – nicht sofort neu:
     Das Schlafzimmer verwarf zweimal alles, als die neue Verbindung Sekunden nach dem Stillstand kam (17:11, 19:22),
     und klappte zweimal, als 1 min MSE dazwischen lag (18:35, 18:45). Ebenso nach dem Neuladen wegen einer neuen Fassung.
     23.10. (.23): „Zu langsam“ nur, wenn der Fernseher selbst langsam dekodiert (über 40 ms je Bild) – nicht, wenn der
     Streamer kurz weniger Bilder schickt (VM ausgelastet, 19:54 Schlafzimmer 15–19 Bilder/s bei 0 ms Dekodierzeit).
     23.10. (.23): Anzeige-Wächter. Das Schlafzimmer dekodierte ab 20:01 weiter 23–30 Bilder/s, zeigte aber ein stehendes
     Bild. Zeigt das Video-Element 5 s lang keine neuen Bilder (alle verworfen) oder zeichnet die Seite gar nicht mehr
     (requestAnimationFrame steht), wird das Bild neu angehängt; hilft das nicht, 1 min MSE, dann WebRTC – beim zweiten
     Mal in 30 min 60 min MSE. Neue Messwerte anzeige_s, element_verworfen_s, raf_s zeigen beim nächsten Mal, was steht.
     23.10. (.24): Fernseher holen das WebRTC-Bild in 1920×1070 (Voreinstellung des Streamers, WEBRTC_TV) – so groß ist
     ihre Browserfläche. Dekodiert der Fernseher zu langsam, stuft die Seite selbst ab: voll → 1920 → 1280, erst dann MSE
     (Wohnzimmer 23.10.: volles Bild 7 Bilder/s, 1920 und 1280 je 30). „Zeichnet nicht“ (requestAnimationFrame 0) zählt nur,
     wenn die Seite vorher flüssig gezeichnet hat – der webOS-5-Browser im Wohnzimmer zeichnet nur 2–3×/s, das Video läuft
     trotzdem mit 30 Bildern/s.
     23.10. (.25): requestAnimationFrame zählt gar nicht mehr für „Anzeige steht“ – das Schlafzimmer zeichnete mit dem
     1920er-Bild 0×/s (Video läuft am Browser vorbei direkt auf den Bildschirm) und hätte nach jedem Einblenden der Leiste
     fälschlich auf MSE gewechselt. raf_s bleibt als Messwert. Neu in den Messwerten: seite_fassung (Fassung dieser Seite).
     Springt der Bildzähler des Video-Elements zurück (neu angehängt, Bildweg gewechselt), zählt diese Messung nicht –
     vorher standen dann kurz negative Bilder/s in den Messwerten.
     23.10. (.26): Zeigerbewegungen gehen nach Zeit (höchstens alle 25 ms) an die VM, nicht mehr im Takt von
     requestAnimationFrame – mit 0 Zeichnungen/s (Schlafzimmer, 1920er-Bild) kamen sonst nur noch Klicks an, Überfahren und
     Ziehen (Schieberegler) nicht.
     24.10. (.27): Tasten ohne Schriftzeichen (Zurück, Pfeile, OK, Farbtasten …) stehen mit Tastencode im Verlauf – die
     Zurück-Taste öffnete am Fernseher die untere Menüleiste; so sieht man, was überhaupt bei der Seite ankommt.
     Getippte Zeichen werden nie mitgeschrieben (Passwörter).
     24.10. (.27): Eingabefeld für Textfelder. Klickt man im Chromium in ein Textfeld, meldet der Streamer das; oben erscheint
     ein eigenes Feld – ein Klick hinein öffnet die Tastatur des Fernsehers (bzw. des Handys). Getipptes geht als echte Eingabe
     ins Feld im Chromium, OK/Enter schickt Enter, „Schließen“ blendet es aus. Am PC (ohne Touch) nicht nötig: dort tippt
     die Tastatur direkt.
     24.10. (.28): Das Eingabefeld nimmt den Fokus nur, wenn man gerade selbst in ein Textfeld geklickt hat. Setzt eine Seite
     den Fokus von allein (z. B. die Anmeldung bei Loxone), erscheint es nur – die Tastatur des Fernsehers springt nicht auf,
     und Pfeil- und Farbtasten gehen weiter an die VM. Farbtasten wirken auch beim Tippen im Eingabefeld.
     24.10. (.30): Kurze Hinweise des Streamers unten im Bild (z. B. „Schon auf der Startseite“, „Loxone wird nicht neu
     geladen“). Ton (?ton=1, Streamer mit AUDIO=1): WebRTC holt eine Tonspur dazu, MSE bekommt den Ton im Videostrom (AAC).
     Das Video bleibt stumm, bis man zum ersten Mal klickt oder eine Taste drückt (Fernseher spielen Ton erst nach einer
     Bedienung); Lautstärke am Fernseher. Messwert „ton“ zeigt, ob Tonpakete ankommen.
     24.10. (.31): Versuch für das Schlafzimmer (?zeichnen=canvas): Dort dekodiert der Fernseher das WebRTC-Bild, zeigt es aber
     nicht an (Anzeige steht, Zähler laufen). Mit ?zeichnen=canvas zeichnet die Seite jedes Bild selbst in ein Canvas (Takt per
     Timer, nicht per requestAnimationFrame) und das Video-Element wird winzig – so kommt das Bild nicht über die Videoebene des
     Fernsehers. Nur bei WebRTC; im MSE-Rückfall wie bisher. Messwerte canvas_s (gezeichnete Bilder/s) und canvas_ms.
     Der Anzeige-Wächter (.23) gilt nur noch am Fernseher – Firefox am PC zählt WebRTC-Bilder als verworfen und fiel dadurch
     grundlos auf MSE zurück.
     24.10. (.32): ?tonsync=0 trennt bei WebRTC den Ton vom Bild – gekoppelt hält der Browser das Bild für den Ton zurück
     (Jitterpuffer 100–300 ms statt ~22 ms). Voreinstellung bleibt gekoppelt: So wurde das Wohnzimmer am 24.10.
     um 10:12 bestätigt (Ton, Bild „relativ schnell“); getrennt wird erst nach einem gemeinsamen Vergleich Standard.
     24.10. (.32): ?webrtc=vp8 holt die VP8-Quelle des Streamers (1280 breit) – Versuch fürs Schlafzimmer, dessen Videoebene das
     H.264-WebRTC-Bild nicht anzeigt (schwarz/stehend). VP8 dekodiert der Browser selbst. Beim Öffnen der Seite kommt der
     HA-Reiter nach vorn (nicht nach dem Neuladen wegen einer neuen Fassung; ?reiter=bleiben lässt den Reiter, wie er ist).
     24.10. (.32): Bildweg JPEG (?video=jpeg) – für das Schlafzimmer, dessen Videoebene WebRTC nicht anzeigt. Der Streamer
     schickt Einzelbilder (nur geänderte), die Seite zeichnet sie selbst in zwei <img> im Wechsel (erst fertig dekodieren, dann
     umschalten) – wie die Einblendung, die dort immer sichtbar war. Jedes angezeigte Bild meldet sie zurück; der Streamer
     schickt erst dann weitere (höchstens ?vorrat=2 unterwegs) – kein Puffer, kein Rückstand. ?jpeg=hd|fhd|voll (1280 / 1920 /
     volles Bild), ?q=5 (Qualität wie ffmpeg, kleiner = besser), ?jfps=30. Kommt in 10 s kein Bild, geht es mit MSE weiter.
     Die Einblendung (?debug=1) wird nur noch 1× pro Sekunde neu geschrieben: Mit ihr zeigte das Schlafzimmer per VP8 nur
     13 statt 28 Bilder/s (24.10. 09:57 / 10:06).
     24.10. (.33): ?jzeichnen=bitmap – JPEG per createImageBitmap dekodieren (abseits der Seite, mehrere zugleich: ?parallel=2)
     und ins Canvas zeichnen. Grund: Das Schlafzimmer brauchte mit <img> 130 ms je 1280er-Bild (7,5 Bilder/s, 10:47).
     ?jpeg=sd: 960 breit. Seit .34 dekodiert auch der <img>-Weg mehrere Bilder zugleich (?parallel=N, Pool aus N+1 Bildern),
     und der Bitmap-Weg zeichnet im Takt von requestAnimationFrame (Messwerte raf_gezeichnet_s / direkt_gezeichnet_s) – am
     Schlafzimmer lief die Seite im Bitmap-Weg mit 0 Zeichnungen/s (11:11), ob das Canvas dann wirklich neu gezeichnet wird,
     ist offen. Kommt 250 ms nach dem Dekodieren kein Zeichen-Takt, wird direkt gezeichnet.
     24.10. (.34b): Das Canvas entsteht nur noch im Bitmap-Weg. Schon ein unsichtbares bildschirmgroßes Canvas ließ den
     Schlafzimmer-Fernseher keine Bilder mehr zeichnen (Zeichen-Takt 0, <img>.decode() blieb hängen → „nach 10 s kein Bild“,
     11:08 und 11:34); ohne Canvas lief der <img>-Weg mit 35–50 Zeichen-Takten/s. -->

<script>
(function () {

  location.search.substring(1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) { Q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); } });

  var WS = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

  var why = '';                                   /* Grund, falls WebRTC (oder JPEG) aufgegeben wurde */

  var rtc = null, rtcT0 = 0, R = {}, quick = false;

  var SRC = String(Q.webrtc !== undefined ? Q.webrtc : (TV ? (CFG.webrtc_tv || '') : '')).toLowerCase();

  /* Zeichen-Versuch (.31, ?zeichnen=canvas): WebRTC-Bild selbst ins Canvas zeichnen, Video-Element winzig */

  var cv = document.getElementById('cv'), cx = null, cvOn = false, CV = { n: 0, ms: 0, n0: 0, ms0: 0, t0: Date.now(), s: null, avg: null, err: '' };

  function status(text) { st.textContent = text || ''; st.style.display = text ? 'block' : 'none'; }
  function two(n, l) { n = String(n); while (n.length < (l || 2)) { n = '0' + n; } return n; }
  function clock() { var d = new Date(); return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + '.' + two(d.getMilliseconds(), 3); }
  function play() { var p = v.play(); if (p && p.then) { p.then(null, function () {}); } }

  function resetMedia() {

    try { if (v.srcObject) { v.srcObject = null; } } catch (e) {}

      try { sb = ms.addSourceBuffer(type); sb.addEventListener('updateend', pump); pump(); }

    var total = 0, i, buf, off = 0;
    for (i = 0; i < queue.length; i++) { total += queue[i].byteLength; }

  var hw = document.getElementById('hw'), hwT = null;
  function hint(t) {
    if (!t) { return; }
    hw.textContent = t; hw.className = 'on'; mark('hinweis ' + t.substring(0, 40));
    if (hwT) { clearTimeout(hwT); }
    hwT = setTimeout(function () { hw.className = ''; hwT = null; }, 2800);
  }
  function nearBar(e) {
    var r = bar.getBoundingClientRect(), m = 30 * K;
    return e.clientY < 20 * K || (e.clientX > r.left - m && e.clientX < r.right + m && e.clientY < r.bottom + m);
  }
  showBar(4000);

  /* Zeigerbewegungen: die erste sofort, danach höchstens alle 25 ms die jeweils letzte – nach Zeit, nicht per
     requestAnimationFrame: das zeichnet im Schlafzimmer mit dem 1920er-Bild 0×/s, dann kamen Überfahren und Ziehen
     (Schieberegler) gar nicht mehr an, nur Klicks */
  var pend = null, waiting = false, lastDown = 0;
  function flushMove() {
    waiting = false;
    if (pend) { send({ t: 'm', x: pend.x, y: pend.y }); pend = null; waiting = true; setTimeout(flushMove, 25); }
  }
  document.addEventListener('mousemove', function (e) {
    if (nearBar(e)) { showBar(3000); }
    if (inBar(e) || inKb(e)) { return; }
    pend = rel(e);
    if (!waiting) { flushMove(); }
  });
  document.addEventListener('mousedown', function (e) {
    tonAn();
    if (inBar(e) || inKb(e)) { return; }
    var p = rel(e);
    pend = null;
    lastDown = Date.now();
    send({ t: 'm', x: p.x, y: p.y });
    send({ t: 'd', x: p.x, y: p.y, b: e.button });
    e.preventDefault();
  });
  document.addEventListener('mouseup', function (e) { if (inBar(e) || inKb(e)) { return; } var p = rel(e); send({ t: 'u', x: p.x, y: p.y, b: e.button }); e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('wheel', function (e) {
    if (inBar(e) || inKb(e)) { return; }
    var p = rel(e), k = e.deltaMode === 1 ? 40 : (e.deltaMode === 2 ? 800 : 1);
    send({ t: 'w', x: p.x, y: p.y, dx: e.deltaX * k, dy: e.deltaY * k });
    e.preventDefault();
  }, { passive: false });

  /* ---------- Eingabefeld für Textfelder im Chromium (.27) ---------- */
  var kb = document.getElementById('kb'), kbt = document.getElementById('kbt'), kbi = document.getElementById('kbi');
  var KB_USE = TV || ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;   /* am PC tippt die Tastatur direkt */
  var kbOpen = false, kbLast = '';
  function kbHide() { kbOpen = false; kb.className = ''; try { kbi.blur(); } catch (x) {} }
  function kbShow(m) {
    if (!KB_USE) { return; }
    if (!m.an) { if (kbOpen) { mark('textfeld zu'); } kbHide(); return; }
    var pw = m.typ === 'password';
    try { kbi.type = pw ? 'password' : 'text'; } catch (x) {}
    kbi.setAttribute('inputmode', m.typ === 'number' ? 'numeric' : 'text');
    kbi.placeholder = 'Hier klicken und tippen';
    kbt.textContent = (m.titel || 'Eingabe') + (pw && String(m.titel || '').toLowerCase().indexOf('passw') < 0 ? ' (Passwort)' : '');
    kbi.value = pw ? '' : (m.wert || '');
    kbLast = kbi.value;
    kbOpen = true;
    kb.className = 'on';
    /* Fokus nur nach eigenem Klick (bis 2 s davor) – setzt die Seite ihn selbst, bleiben die Tasten bei der VM (.28) */
    var selbst = Date.now() - lastDown < 2000;
    mark('textfeld auf' + (m.typ ? ' ' + m.typ : '') + (selbst ? '' : ' (ohne fokus)'));
    if (selbst) { try { kbi.focus(); } catch (x) {} }
  }
  function kbKey(name, vk) { send({ t: 'k', d: 1, key: name, code: name, vk: vk, text: vk === 13 ? String.fromCharCode(13) : '', mod: 0 });
    send({ t: 'k', d: 0, key: name, code: name, vk: vk, text: '', mod: 0 }); }
  /* Unterschied zum letzten Stand als echte Eingabe: anhängen per insertText, kürzen per Rücktaste, sonst alles neu */
  function kbSync() {
    var v = kbi.value, o = kbLast, i;
    if (v === o) { return; }
    if (v.indexOf(o) === 0) { send({ t: 'txt', s: v.substring(o.length) }); }
    else if (o.indexOf(v) === 0) { for (i = 0; i < o.length - v.length; i++) { kbKey('Backspace', 8); } }
    else { for (i = 0; i < o.length; i++) { kbKey('Backspace', 8); } if (v) { send({ t: 'txt', s: v }); } }
    kbLast = v;
  }
  function kbEnter() { kbSync(); kbKey('Enter', 13); kbHide(); }
  kbi.addEventListener('input', kbSync);
  kbi.addEventListener('keydown', function (e) {
    var kc = e.keyCode || e.which;
    if (kc === 13) { e.preventDefault(); kbEnter(); }
    else if (kc === 27 || kc === 461) { e.preventDefault(); backAt = Date.now(); kbHide(); }   /* nur schließen, nicht zurück */
  });
  document.getElementById('kbok').addEventListener('click', kbEnter);
  document.getElementById('kbx').addEventListener('click', kbHide);
  function inKb(e) { return kbOpen && kb.contains(e.target); }

  var KEYS = { 8: 'Backspace', 9: 'Tab', 13: 'Enter', 27: 'Escape', 32: ' ', 35: 'End', 36: 'Home', 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown', 46: 'Delete' };
  /* Fernbedienung: Zurück; Farbtasten wie die Systeme – blau Home Assistant, grün Loxone, gelb neu laden, rot zurück
     (Test 23.10.: „Home Assistant ist immer blau, Loxone immer grün“); Kanal +/- = Zoom */
  var REMOTE = { 461: 'back', 403: 'back', 404: 'link:loxone', 405: 'reload', 406: 'home' };
  if (TV) { REMOTE[33] = 'zoomin'; REMOTE[34] = 'zoomout'; }
  var backAt = 0;
  function key(e, down) {
    var kc = e.keyCode || e.which, k = e.key, text = '', mod, shortcut = e.metaKey || (e.ctrlKey && !e.altKey);
    if (e.target === kbi) {   /* tippt ins eigene Eingabefeld – nicht an die VM (Enter/Zurück dort); Farbtasten wirken trotzdem */
      if (kc >= 403 && kc <= 406) {
        if (down) { kbHide(); mark('taste ' + kc + ' → ' + REMOTE[kc]); if (REMOTE[kc] === 'back') { backAt = Date.now(); } send({ t: 'c', c: REMOTE[kc] }); }
        return true;
      }
      return false;
    }
    /* Tastencode in den Verlauf – nur Tasten ohne Schriftzeichen, nie Getipptes */
    if (down && !(k && k.length === 1) && !(kc >= 48 && kc <= 90) && !(kc >= 96 && kc <= 111) && kc !== 32) {
      mark('taste ' + kc + (k ? ' ' + String(k).substring(0, 16) : '') + (REMOTE[kc] ? ' → ' + REMOTE[kc] : ''));
    }
    if (REMOTE[kc]) { if (down) { if (REMOTE[kc] === 'back') { backAt = Date.now(); } send({ t: 'c', c: REMOTE[kc] }); } return true; }
    if (e.altKey && !e.ctrlKey && !e.metaKey && (kc === 36 || kc === 37 || kc === 39)) {   /* Alt+Pos1 / Alt+← / Alt+→ wie im Browser */
      if (down) { if (kc === 37) { backAt = Date.now(); } send({ t: 'c', c: kc === 36 ? 'home' : (kc === 37 ? 'back' : 'forward') }); }
      return true;
    }
    if (shortcut && (k === 'v' || k === 'V')) { return false; }   /* Einfügen übernimmt der Browser, siehe „paste“ */
    if (KEYS[kc]) { k = KEYS[kc]; text = kc === 13 ? String.fromCharCode(13) : (kc === 32 ? ' ' : ''); }
    else if (k && k.length === 1) { text = k; }
    else { return false; }
    mod = (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
    if (shortcut) { text = ''; }
    else if (text && !KEYS[kc]) { mod = mod & 8; }   /* Zeichen über AltGr bzw. Option (@ € { } …) direkt eintippen */
    else if (mod & 7) { text = ''; }
    send({ t: 'k', d: down ? 1 : 0, key: k, code: e.code || '', vk: kc, text: text, mod: mod });
    return true;
  }
  document.addEventListener('keydown', function (e) { tonAn(); if (key(e, true)) { e.preventDefault(); } });
  document.addEventListener('keyup', function (e) { if (key(e, false)) { e.preventDefault(); } });
  /* Strg/Cmd+V am PC: Text aus der Zwischenablage des PCs eintippen (z. B. Passwort aus dem Passwort-Manager) */
  document.addEventListener('paste', function (e) {
    if (kbOpen && e.target === kbi) { return; }        /* ins eigene Feld – geht über „input“ weiter */
    var s = '';
    try { s = (e.clipboardData || window.clipboardData).getData('text'); } catch (x) {}
    if (s) { send({ t: 'txt', s: s }); }
    e.preventDefault();
  });
  /* Zurück-Taste, falls der Fernseher sie als Browser-Zurück auslöst: eigenen Verlaufseintrag halten */
  try { history.pushState({ tv: 1 }, '', location.href); } catch (e) {}
  window.addEventListener('popstate', function () {
    mark('popstate' + (Date.now() - backAt > 500 ? ' → back' : ''));
    if (Date.now() - backAt > 500) { send({ t: 'c', c: 'back' }); }
    try { history.pushState({ tv: 1 }, '', location.href); } catch (e) {}
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (!vws) { connectVideo(); } if (!iws) { connectInput(); } } });
  /* Beim Verlassen/Neuladen die WebRTC-Verbindung ausdrücklich schließen und das Video lösen – der Fernseher soll seinen
     Dekoder sofort freigeben (Verdacht 23.10.: nach mehrfachem Neuladen dekodierte das Wohnzimmer nur noch 7 Bilder/s) */
  function leave() { try { v.srcObject = null; } catch (e) {} closeRtc(); }
  window.addEventListener('pagehide', leave);
  window.addEventListener('beforeunload', leave);
  connectInput();
  connectVideo();
  if (START_MSE && !rtcRetryTimer) {
    rtcRetryTimer = setTimeout(function () {
      rtcRetryTimer = null;
      if (MODE !== 'mse') { return; }
      mark('webrtc nach neuer fassung'); MODE = 'webrtc'; quick = true; why = '';
      try { if (vws) { vws.close(); } else { connectVideo(); } } catch (e) {}
    }, 60000);
  }
})();
</script>
</body>
</html>
